name: Build and publish image

# 本机 docker build 很占磁盘，构建统一放到这里跑，产物推到 GHCR。
# 服务器侧改成 docker pull ghcr.io/onesoft-j1ao/rex-api:<tag> 即可。
on:
  push:
    branches:
      - main
      - 'deploy/**'
    tags:
      - 'v*'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/onesoft-j1ao/rex-api

jobs:
  build:
    name: Build & push (linux/amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Resolve tags
        id: version
        run: |
          SHA=$(git rev-parse --short HEAD)
          # 分支名里的 / 不能进 docker tag
          BRANCH=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          echo "sha=${SHA}" >> $GITHUB_OUTPUT
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
          echo "${SHA}" > VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to ghcr.io
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}

      - name: Build & push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          # 服务器是 x86_64，只构建 amd64；要 arm64 再加一个 matrix 分支。
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.version.outputs.branch }}
            ${{ env.IMAGE }}:${{ steps.version.outputs.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Image summary
        run: |
          {
            echo "### 镜像已推送"
            echo '```'
            echo "${{ env.IMAGE }}:latest"
            echo "${{ env.IMAGE }}:${{ steps.version.outputs.branch }}"
            echo "${{ env.IMAGE }}:${{ steps.version.outputs.sha }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
            echo
            echo "服务器上更新："
            echo '```'
            echo "docker pull ${{ env.IMAGE }}:${{ steps.version.outputs.sha }}"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      # 服务器网络受墙时 GHCR 拉不动，就从这个 artifact 下载 tgz 再
      # `docker load`。gzip 后约 80MB（镜像本体 333MB），远小于 save 出的 tar。
      - name: Export compressed image
        run: |
          docker pull --quiet ${{ env.IMAGE }}:${{ steps.version.outputs.sha }}
          docker save ${{ env.IMAGE }}:${{ steps.version.outputs.sha }} | gzip \
            > rex-api-${{ steps.version.outputs.sha }}.tgz
          ls -la rex-api-*.tgz

      - name: Upload image tgz
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rex-api-image-${{ steps.version.outputs.sha }}
          path: rex-api-*.tgz
          retention-days: 14
          compression-level: 0
